# ==========================================================
# TMUX CONFIG - DUNK
# Paleta naranja + verde + fondo oscuro
# ==========================================================

# ----------------------------------------------------------
# PREFIJO
# ----------------------------------------------------------

# Quitar Ctrl+b
unbind C-b

# Usar Ctrl+s como prefijo
set -g prefix C-s

# Ctrl+s dos veces envía Ctrl+s al programa actual
bind C-s send-prefix

# ----------------------------------------------------------
# SHELL Y TERMINAL
# ----------------------------------------------------------

# Fish como shell predeterminado
set -g default-shell "/opt/homebrew/bin/fish"
set -g default-command "/opt/homebrew/bin/fish"

# Terminal interna de tmux compatible con macOS
set -g default-terminal "tmux-256color"

# Soporte True Color
set -as terminal-overrides ",xterm-kitty:RGB"
set -as terminal-overrides ",xterm-256color:RGB"

# Mejor integración con Neovim y otras aplicaciones
set -g focus-events on

# ----------------------------------------------------------
# PALETA DE COLORES
# ----------------------------------------------------------

BG0="#081A2B"
BG1="#10233A"
BG2="#18304A"
BG3="#24405F"

FG="#D8E8FF"
FG_MUTED="#9CB7D9"

ORANGE="#F5A43A"
ORANGE_DARK="#E46C36"

GREEN="#9BE64C"
GREEN_DARK="#64D85B"

YELLOW="#FFD166"
RED="#F16D4F"
PINK="#FF5FA2"
BLUE="#7DC4FF"
PURPLE="#B388FF"

# ----------------------------------------------------------
# CONFIGURACIÓN GENERAL
# ----------------------------------------------------------

# Barra en la parte superior
set -g status-position top

# Actualizar la barra cada segundo
set -g status-interval 1

# Fondo general
set -g status-style "fg=$FG,bg=$BG1"

# Ventanas alineadas a la izquierda
set -g status-justify left

# Longitud de las secciones
set -g status-left-length 100
set -g status-right-length 150

# Renumerar ventanas al cerrar una
set -g renumber-windows on

# Mantener nombres automáticos
set -g automatic-rename on
set -g allow-rename off

# Índices desde 1
set -g base-index 1
setw -g pane-base-index 1

# Menor tiempo de espera para combinaciones
set -s escape-time 0

# Historial
set -g history-limit 100000

# ----------------------------------------------------------
# VENTANAS Y PANELES
# Mantienen el directorio actual
# ----------------------------------------------------------

# Nueva ventana
bind c new-window -c "#{pane_current_path}"

# División horizontal: panel arriba/abajo
bind '"' split-window -v -c "#{pane_current_path}"

# División vertical: panel izquierda/derecha
bind % split-window -h -c "#{pane_current_path}"

# Atajos alternativos
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ----------------------------------------------------------
# RECARGAR CONFIGURACIÓN
# ----------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "Configuración de tmux recargada"

# ----------------------------------------------------------
# PANELES
# ----------------------------------------------------------

# Panel inactivo
set -g pane-border-style "fg=$BG3"

# Panel activo
set -g pane-active-border-style "fg=$GREEN"

# Números al pulsar prefix + q
set -g display-panes-colour "$ORANGE"
set -g display-panes-active-colour "$GREEN"

# Tiempo visible de los números
set -g display-panes-time 1500

# ----------------------------------------------------------
# MENSAJES Y COMANDOS
# ----------------------------------------------------------

# Mensajes normales
set -g message-style "fg=$FG,bg=$BG3"

# Línea de comandos al pulsar prefix + :
set -g message-command-style "fg=$BG1,bg=$ORANGE,bold"

# ----------------------------------------------------------
# COPY MODE
# ----------------------------------------------------------

setw -g mode-keys vi

setw -g mode-style "fg=$BG1,bg=$GREEN,bold"

set -g copy-mode-match-style "fg=$BG1,bg=$ORANGE"
set -g copy-mode-current-match-style "fg=$BG1,bg=$GREEN,bold"
set -g copy-mode-mark-style "fg=$BG1,bg=$YELLOW"

# ----------------------------------------------------------
# RELOJ
# ----------------------------------------------------------

setw -g clock-mode-colour "$ORANGE"

# ----------------------------------------------------------
# BELL Y ACTIVIDAD
# ----------------------------------------------------------

setw -g window-status-bell-style "fg=$BG1,bg=$RED,bold"

setw -g window-status-activity-style "fg=$YELLOW,bg=$BG1"

setw -g window-status-last-style "fg=$GREEN,bg=$BG1"

# ----------------------------------------------------------
# STATUS LEFT
# Usuario naranja
# ----------------------------------------------------------

set -g status-left "\
#[fg=$BG1,bg=$ORANGE,bold]   #(whoami) \
#[fg=$ORANGE,bg=$BG1,nobold]"

# ----------------------------------------------------------
# VENTANAS INACTIVAS
# ----------------------------------------------------------

set -g window-status-separator ""

set -g window-status-format "\
#[fg=$BG1,bg=$BG3]\
#[fg=$ORANGE,bg=$BG3,bold] #I \
#[fg=$FG_MUTED,bg=$BG3,nobold] \
#[fg=$FG_MUTED,bg=$BG3] #W \
#[fg=$BG3,bg=$BG1]"

# ----------------------------------------------------------
# VENTANA ACTIVA
# ----------------------------------------------------------

set -g window-status-current-format "\
#[fg=$BG1,bg=$GREEN]\
#[fg=$BG1,bg=$GREEN,bold] #I \
#[fg=$ORANGE,bg=$GREEN] \
#[fg=$BG1,bg=$GREEN,bold] #W \
#[fg=$GREEN,bg=$BG1,nobold]"

# ----------------------------------------------------------
# STATUS RIGHT
# Fecha, hora y nombre del equipo
# ----------------------------------------------------------

set -g status-right "\
#[fg=$BG3,bg=$BG1]\
#[fg=$ORANGE,bg=$BG3,bold]   %Y-%m-%d \
#[fg=$FG_MUTED,bg=$BG3,nobold]│\
#[fg=$GREEN,bg=$BG3,bold]   %H:%M \
#[fg=$ORANGE,bg=$BG3]\
#[fg=$BG1,bg=$ORANGE,bold] 󰒋  #h "

# ----------------------------------------------------------
# MENÚS
# ----------------------------------------------------------

set -g menu-style "fg=$FG,bg=$BG2"

set -g menu-selected-style "fg=$BG1,bg=$ORANGE,bold"

set -g menu-border-style "fg=$GREEN"

# ----------------------------------------------------------
# POPUPS
# ----------------------------------------------------------

set -g popup-style "fg=$FG,bg=$BG2"

set -g popup-border-style "fg=$ORANGE"

# ----------------------------------------------------------
# RATÓN
# ----------------------------------------------------------

set -g mouse on
