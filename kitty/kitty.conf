font_family      Hack Nerd Font
bold_font        auto
italic_font      CaskaydiaCove Nerd Font Mono
bold_italic_font CaskaydiaCove Nerd Font Mono

# font_family      Hack Nerd Font
# bold_font        auto
# italic_font      JetBrainsMono Nerd Font Mono
# bold_italic_font CaskaydiaCove Nerd Font Mono

cursor_shape block
font_size 14
hide_window_decorations yes
background_opacity 0.8
background_blur 100
window_padding_width 2
window_border_width 2
padding_left 5
window_border_color #444444
active_border_color #ff5555
inactive_border_color #333333
active_tab_position top
modify_font cell_height 120%
shell /opt/homebrew/bin/fish

include current-theme.conf
